<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonshine Valley Barometer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 300;
    color: #8892b0;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .forecast-container {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #forecast-img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
  }
  .footer {
    margin-top: 20px;
    font-size: 0.85rem;
    color: #4a4a6a;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  #brightness-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 9999;
    background: white;
    opacity: 0;
    mix-blend-mode: screen;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
  <div id="brightness-overlay"></div>
  <h1>Moonshine Valley &mdash; 6-Hour Atmospheric Strip</h1>
  <div class="forecast-container">
    <img id="forecast-img" src="/api/forecast/svg" alt="Forecast strip">
  </div>
  <div class="footer">
    <span class="status-dot"></span>
    <span>Live</span>
    <span id="status-text">updates every 60s</span>
  </div>
  <script>
    var img = document.getElementById('forecast-img');
    var st = document.getElementById('status-text');
    var cd = 60;

    img.onerror = function() {
      st.textContent = 'load error, retrying';
    };

    function tick() {
      cd--;
      if (cd <= 0) {
        img.src = '/api/forecast/svg?_=' + Date.now();
        cd = 60;
      }
      st.textContent = 'next update in ' + cd + 's';
    }

    setInterval(tick, 1000);

    (function() {
      if (window.WebviewKioskBrightnessInterface) {
        window.WebviewKioskBrightnessInterface.setBrightness(75);
        var overlay = document.getElementById('brightness-overlay');
        if (overlay) overlay.style.opacity = '0.25';
      }
    })();
  </script>
</body>
</html>
